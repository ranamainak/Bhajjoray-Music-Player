        .playlists ul, .songs-in-playlist ul { list-style: none; padding: 0; margin: 10px 0 0 0; flex-grow: 1; overflow-y: auto; max-height: 250px; }

        .playlists li.selected, .songs-in-playlist li.selected { background-color: #4A90E2; color: #fff; }

        .album-art { width: 300px; height: 250px; object-fit: contain; border-radius: 8px; border: 0; flex-shrink: 0; }
        #song-title { margin: 0; font-size: 1.2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; max-width: 100%; flex-shrink: 0; }
        .player-controls { display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0; width: 100%; justify-content: center; margin-top: 10px; }
        .media-player audio { width: calc(100% - 50px); max-height: 50px; flex-shrink: 0; }
        .repeat-button { background: none; border: none; cursor: pointer; font-size: 18px; color: #333; padding: 5px; border-radius: 5px; flex-shrink: 0; margin-top: 5px; }
        .repeat-button.active { color: #4A90E2; background-color: #e6f0fa; }
        .repeat-button:hover { background-color: #f0f0f0; }
        .inactive-icon { opacity: 0.4; pointer-events: none; }

        footer { text-align: center; padding: 20px 0; background-color: #FFF085; color: #000000; border-radius: 8px; margin-top: 20px; }
        .footer-links { margin-bottom: 15px; }
        .footer-links a { color: #333; text-decoration: none; margin: 0 10px; font-size: 0.9em; }

        .footer-links span { color: #666; }

        @media (max-width: 1024px) {

            .playlists ul, .songs-in-playlist ul { max-height: 300px; }
            .album-art { width: 120px; height: 120px; }

            .playlists ul, .songs-in-playlist ul { max-height: 200px; }

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        let playlists = {};
        try {
            const response = await fetch('playlists.json');
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            playlists = await response.json();
        } catch (error) {
            console.error("Could not fetch playlist data:", error);
            const playlistList = document.getElementById('playlist-list');
            playlistList.innerHTML = '<li>Error loading playlists.</li>';
            return;
        }

        const playlistList = document.getElementById('playlist-list');
        const songList = document.getElementById('song-list');
        const audioPlayer = document.getElementById('audio-player');
        const audioSource = document.getElementById('audio-source');
        const repeatButton = document.getElementById('repeat-button');
        const songTitle = document.getElementById('song-title');
        const albumArt = document.getElementById('album-art');

        let currentPlaylistId = null;
        let currentSongIndex = -1;

        const playlistNames = Object.keys(playlists);
        playlistList.innerHTML = playlistNames.map(name => `<li data-playlist="${name}">${name}</li>`).join('');
        const playlistItems = document.querySelectorAll('#playlist-list li');

        repeatButton.addEventListener('click', () => {
            audioPlayer.loop = !audioPlayer.loop;
            repeatButton.classList.toggle('active', audioPlayer.loop);
        });

        async function playSong(playlistId, songIndex) {
            const songs = playlists[playlistId] || [{ title: "No songs available", url: "#", image: "default.jpg" }];
            const song = songs[songIndex];

            audioSource.src = song.url;
            audioPlayer.load();
            try { await audioPlayer.play(); } catch (error) { console.error("Playback failed:", error); }

            songTitle.textContent = song.title;
            albumArt.src = `images/${song.image}`;
            albumArt.alt = `${song.title} Album Art`;

            const songItems = songList.querySelectorAll('li');
            songItems.forEach((item, index) => item.classList.toggle('selected', index === songIndex));

            currentPlaylistId = playlistId;
            currentSongIndex = songIndex;
        }

        audioPlayer.addEventListener('ended', () => {
            if (!audioPlayer.loop && currentPlaylistId) {
                const songs = playlists[currentPlaylistId];
                let nextSongIndex = currentSongIndex + 1;
                if (nextSongIndex >= songs.length) nextSongIndex = 0;
                playSong(currentPlaylistId, nextSongIndex);
            }
        });

        playlistItems.forEach(item => {
            item.addEventListener('click', () => {
                playlistItems.forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');

                const playlistId = item.getAttribute('data-playlist');
                const songs = playlists[playlistId] || [{ title: "No songs available", url: "#", image: "default.jpg" }];
                songList.innerHTML = songs.map((song, index) => `<li data-index="${index}">${song.title}</li>`).join('');

                if (songs.length > 0 && songs[0].url !== "#") {
                    playSong(playlistId, 0);
                }

                const songItems = songList.querySelectorAll('li');
                songItems.forEach(songItem => {
                    songItem.addEventListener('click', () => {
                        const index = parseInt(songItem.getAttribute('data-index'), 10);
                        playSong(playlistId, index);
                    });
                });
            });
        });
    });
    </script>
